@if (open()) {
  <button
    type="button"
    class="ui-drawer__backdrop"
    [disabled]="busy()"
    aria-hidden="true"
    (click)="requestClose()"
  ></button>
  <aside class="ui-drawer" role="dialog" aria-modal="true" aria-labelledby="ui-drawer-title">
    <header class="ui-drawer__header">
      <div>
        <h4 id="ui-drawer-title">{{ title() }}</h4>
        @if (subtitle(); as subtitle) {
          <span>{{ subtitle }}</span>
        }
      </div>
      <app-ui-button
        [label]="'common.close' | translate"
        [title]="'common.close' | translate"
        iconLeft="close"
        variant="ghost"
        [iconOnly]="true"
        size="sm"
        [disabled]="busy()"
        (click)="requestClose()"
      />
    </header>
    <div class="ui-drawer__content"><ng-content /></div>
    <footer class="ui-drawer__footer"><ng-content select="[uiDrawerFooter]" /></footer>
  </aside>
}
